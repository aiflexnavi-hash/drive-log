# 乗務記録 Android アプリ（テスト版）を作る。画面はウェブ版と同じ index.html / shim.js。
# 署名はここではしない（鍵は公開リポジトリに置かない）。できた AAB/APK は Actions の成果物と、リリース（build-版番号）に置く。
name: android
on:
  workflow_dispatch:
    inputs:
      bg: { description: "裏での位置記録を入れる（試し）", type: boolean, default: false }
  push:
    paths: ["app/**", "index.html", "shim.js", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: www を作る
        working-directory: app
        env: { APP_VERSION: "0.1.${{ github.run_number }}" }
        run: |
          npm install --no-audit --no-fund
          if [ "${{ inputs.bg }}" = "true" ]; then node -e "const f='config.json',c=require('./'+f);c.bg=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"; fi
          # 裏での位置記録（config.json の bg が true のときだけ。Play で位置の申告が要る）
          if node -e "process.exit(require('./config.json').bg?0:1)"; then npm install --no-audit --no-fund @capacitor-community/background-geolocation@1.3.1; echo BG=1 >> $GITHUB_ENV; fi
          node build-www.js
      - name: Android プロジェクトを作る
        working-directory: app
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0f1316' --iconBackgroundColorDark '#0f1316' --splashBackgroundColor '#0f1316' --splashBackgroundColorDark '#0f1316'
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' $M
          if [ "$BG" != "1" ]; then sed -i 's#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M; fi
          grep -c ACCESS_FINE_LOCATION $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName|targetSdk|minSdk" $G android/variables.gradle || true
          npx cap sync android
      - name: ビルド
        working-directory: app/android
        # テスト用 APK はいつも同じ鍵で署名する（アンインストールせずに上書き更新できるように）
        run: |
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: driver-app-0.1.${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: 受け取り用に置く（署名前。署名は鍵を持つ側で行う）
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=0.1.${{ github.run_number }}${{ inputs.bg && '-bg' || '' }}
          cp app/android/app/build/outputs/bundle/release/app-release.aab driver-$V-unsigned.aab
          cp app/android/app/build/outputs/apk/debug/app-debug.apk driver-$V-debug.apk
          gh release create "build-$V" driver-$V-unsigned.aab driver-$V-debug.apk --prerelease --target "${{ github.sha }}" --title "テスト版ビルド $V（署名前）" --notes "自動ビルド。ストアに出すものは別に署名する。"
